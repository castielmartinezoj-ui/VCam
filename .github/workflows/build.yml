name: Build VCam

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Tweak
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        export HOMEBREW_NO_AUTO_UPDATE=1
        brew install ldid xz dpkg 2>/dev/null || brew install ldid2 xz dpkg
      timeout-minutes: 15

    - name: Install Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git ~/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "PATH=$HOME/theos/bin:$PATH" >> $GITHUB_ENV
      timeout-minutes: 15

    - name: Install iOS SDK
      run: |
        mkdir -p $HOME/theos/sdks
        for i in 1 2 3; do
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz && break
          sleep 10
        done
        tar -xf /tmp/sdk.tar.xz -C $HOME/theos/sdks
        ls $HOME/theos/sdks/
      timeout-minutes: 15

    - name: Build Tweak
      run: |
        export THEOS=$HOME/theos
        export PATH=$HOME/theos/bin:$PATH
        make clean 2>&1 || true
        make package FINALPACKAGE=1 2>&1
        ls -lh packages/
      timeout-minutes: 20

    - name: Upload deb
      uses: actions/upload-artifact@v4
      with:
        name: VCam-deb
        path: packages/*.deb
        retention-days: 30
